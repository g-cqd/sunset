name: CI

# swift-ci plans and runs the checks from .ci/action.json (https://github.com/g-cqd/swift-ci). `.ci/swift-ci local` runs the same checks on a
# developer's machine. Mutation testing is the `mutation` command of .ci/action.json (litmus), on pull requests only (ADR-0126); locally it runs in the background, never in the loop.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Checks
    uses: g-cqd/swift-ci/.github/workflows/swift-ci.yml@47a42af8d79c2e5f8a50f9c4a13b0d3b46f2d009 # swift-ci 47a42af
    permissions:
      contents: write # reusable publish permission; this package publishes no archives

  scan:
    name: Code Scanning
    uses: g-cqd/swift-ci/.github/workflows/code-scanning.yml@fda8ff085332c1883685384f975dff7227b1f7e5 # swift-ci fda8ff0
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      codeql-languages: '["actions", "python"]'
