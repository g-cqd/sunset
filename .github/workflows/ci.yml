name: CI

# swift-ci plans and runs the checks from .ci/action.json (https://github.com/g-cqd/swift-ci). `.ci/swift-ci local` runs the same checks on a
# developer's machine. Mutation testing is the `mutation` command of .ci/action.json (litmus), on pull requests only (ADR-0126); locally it runs in the background, never in the loop.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Checks
    uses: g-cqd/swift-ci/.github/workflows/swift-ci.yml@66845cc3bbfed0cc39148f0c3f2afbd3777d964f # swift-ci 66845cc
    permissions:
      contents: write # reusable publish permission; this package publishes no archives

  scan:
    name: Code Scanning
    uses: g-cqd/swift-ci/.github/workflows/code-scanning.yml@66845cc3bbfed0cc39148f0c3f2afbd3777d964f # swift-ci 66845cc
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      codeql-languages: '["actions", "python"]'
