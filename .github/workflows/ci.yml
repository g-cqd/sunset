name: CI

# swift-ci plans and runs the checks from .ci/action.json (https://github.com/g-cqd/swift-ci). `.ci/swift-ci local` runs the same checks on a
# developer's machine. Mutation testing is the `mutation` command of .ci/action.json (litmus): CI only, never the local loop (white paper section 1).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Checks
    uses: g-cqd/swift-ci/.github/workflows/swift-ci.yml@8dfa7c9438c8b41f9f0f6b25145dcdfaae14b382 # swift-ci 8dfa7c9
    permissions:
      contents: write # reusable publish permission; this package publishes no archives
