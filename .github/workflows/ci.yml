name: CI

# swift-ci plans and runs the checks from .ci/action.json (https://github.com/g-cqd/swift-ci). `.ci/swift-ci local` runs the same checks on a
# developer's machine. Mutation testing is the `mutation` command of .ci/action.json (litmus), on pull requests only (ADR-0126); locally it runs in the background, never in the loop.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Checks
    uses: g-cqd/swift-ci/.github/workflows/swift-ci.yml@2f915b39ab7ff1438e2cd6f998e517eabc875053 # swift-ci 2f915b3
    permissions:
      contents: write # reusable publish permission; this package publishes no archives
