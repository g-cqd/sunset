# Sunset.app (the owner, 2026-11-13: apps are built with XcodeGen, not by a script that assembles a bundle).
#   xcodegen generate                     makes Sunset.xcodeproj (not committed)
#   Scripts/make-app.sh [debug|release]   generates, builds with xcodebuild, and prints where the app is
# The app target compiles one file, Sources/SunsetAppMain/main.swift, and links the package's SunsetAppLibrary: everything else is
# the package. Signing is ad hoc unless Signing.local.xcconfig (not committed) names an identity; a stable one keeps the
# permissions macOS gave Sunset (Accessibility, Screen Recording, folders) across rebuilds.
name: Sunset
options:
  bundleIdPrefix: studio.aemi
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: "0.1"
    # The commit, given by Scripts/make-app.sh.
    CURRENT_PROJECT_VERSION: 0
    GENERATE_INFOPLIST_FILE: YES
    # Hardened (task t49: notarisation requires it): it constrains Sunset's own process only, not what the terminal runs; a page's
    # camera, microphone and location are entitlements (Signing.xcconfig names the file, so that Signing.local.xcconfig may
    # name the team's). Nothing is loaded at run time and only the system's libraries are linked, so library validation
    # refuses nothing.
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Release:
      # No debugger's entitlement (get-task-allow) in the build that is installed.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
packages:
  Sunset:
    path: .
targets:
  Sunset:
    type: application
    platform: macOS
    sources:
      - path: Sources/SunsetAppMain
      - path: App
        excludes: [Info.plist]
    dependencies:
      - package: Sunset
        product: SunsetAppLibrary
    info:
      path: App/Info.plist
      properties:
        # "Sunset Dev" for a debug build, so that Open With and the Dock tell it from the installed one (t276).
        CFBundleDisplayName: $(SUNSET_DISPLAY_NAME)
        CFBundleIconFile: Sunset
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        # What a page the person allows can ask for (web step g).
        NSCameraUsageDescription: A web page you allow can use the camera.
        NSMicrophoneUsageDescription: A web page you allow can use the microphone.
        NSLocationUsageDescription: A web page you allow can know where you are.
        NSLocationWhenInUseUsageDescription: A web page you allow can know where you are.
        # What the programs run in its terminals use: without these macOS refuses them without asking.
        NSDownloadsFolderUsageDescription: Programs you run in Sunset's terminals, and the pages you download, use your Downloads folder.
        NSDocumentsFolderUsageDescription: Programs you run in Sunset's terminals use your Documents folder.
        NSDesktopFolderUsageDescription: Programs you run in Sunset's terminals use your Desktop folder.
        NSRemovableVolumesUsageDescription: Programs you run in Sunset's terminals use removable volumes.
        NSNetworkVolumesUsageDescription: Programs you run in Sunset's terminals use network volumes.
        NSAppleEventsUsageDescription: Programs you run in Sunset's terminals can script other apps.
        # Links to pages: what lets the person choose Sunset as the Mac's browser (note n18); it becomes it only when the
        # person says so (Settings > Web > Pages, or System Settings), never by itself (ADR-0040).
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https]
        # What Sunset can be chosen to open (Open With); it never makes itself the app that opens them (ADR-0040).
        # Pages over plain http load in the web views (a browser's: Load over HTTP, a site with no HTTPS); the app's own
        # requests keep App Transport Security's rule (diary 2026-11-20-10).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
          - CFBundleTypeName: Mermaid diagram
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [studio.aemi.sunset.mermaid]
          - CFBundleTypeName: Text document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn, mdwn]
          - UTTypeIdentifier: studio.aemi.sunset.mermaid
            UTTypeDescription: Mermaid diagram
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [mmd, mermaid]
    # AemiSDR's bundle holds its shaders compiled for iOS, the iOS simulator and macOS: a build-tool plugin is not told which
    # platform it builds for (AemiSDR diary 2026-11-20-01). The app keeps the macOS ones; Xcode signs it after this phase.
    postBuildScripts:
      - name: Keep Only the macOS Shaders
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          find "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" -path "*.bundle/*" \
            \( -name "*.iOS.metallib" -o -name "*.iOSSimulator.metallib" \) -print -delete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.aemi.sunset
        PRODUCT_NAME: Sunset
        # The loader's framework path, in the executable (roadmap 0113, diary 2026-11-23-05, CRIT-02): Sunset WebKit runs
        # on the WebKit in its own Frameworks, system frameworks that link WebKit included, with no exception for the
        # environment's loader variables (which a hardened process ignores). The native build has no WebKit there: the
        # system's is used.
        OTHER_LDFLAGS: ["$(inherited)", "-Wl,-dyld_env,DYLD_FRAMEWORK_PATH=@executable_path/../Frameworks"]
        SUNSET_DISPLAY_NAME: Sunset
        # The icon (roadmap 0084): App/Sunset.icon, made in Design/Icons; Xcode compiles it into Assets.car and into
        # Sunset.icns (CFBundleIconFile). The three other skies go in as alternates, for the person to choose later.
        ASSETCATALOG_COMPILER_APPICON_NAME: Sunset
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: Twilight Dawn Dusk
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
      configs:
        # A debug build is another app to the Mac than the installed one: its own defaults (the window's frame), saved
        # state, permissions and Open With entry, and its own folder and keys (StoragePlaces). The owner, 2026-11-16, t276.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: studio.aemi.sunset.dev
          SUNSET_DISPLAY_NAME: Sunset Dev
