<!doctype html>
<html><head><meta charset="utf-8"><title>Upload</title>
<style>body{font:16px -apple-system,sans-serif;margin:40px}a{display:block;margin:12px 0}video{width:320px;background:#000}</style></head><body>
<h1>Upload</h1>
<input id="f" type="file" multiple onchange="document.title='chose '+[...this.files].map(x=>x.name).join(',')">
<a id="far" href="http://127.0.0.1:8766/article.html?a-very-long-address-under-the-pointer">A link to the tide article</a>
<button id="fs" onclick="document.documentElement.requestFullscreen().then(()=>document.title='fullscreen',e=>document.title='refused '+e.name)">Go fullscreen</button>
<button id="beep" onclick="const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();g.gain.value=0.001;o.connect(g).connect(c.destination);o.start();document.title='playing'">Play a tone</button>
</body></html>
